name: Windows Installer

# Builds the portable app (PyInstaller) and the Inno Setup installer on Windows.
# Referenced by INSTALLER_WINDOWS.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write  # allow the release step to publish the installer

jobs:
  build:
    runs-on: windows-latest
    # At job level so the signing steps' `if:` can read it -- a step's own
    # `env:` block is not visible to its own condition.
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tag that disagrees with APP_VERSION or the Inno version ships an
      # installer the in-app updater cannot recognise (it matches
      # Plume-Setup-<version>.exe against APP_VERSION), so the release would
      # look permanently "available" to every client. Fail here instead.
      - name: Check version consistency
        shell: pwsh
        run: |
          $app = (Select-String -Path plume.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $inno = (Select-String -Path packaging\inno\Plume.iss -Pattern '^#define MyAppVersion "(.+)"').Matches[0].Groups[1].Value
          Write-Host "plume.py=$app  Plume.iss=$inno  ref=${env:GITHUB_REF}"
          if ($app -ne $inno) { throw "APP_VERSION ($app) != MyAppVersion ($inno)" }
          if ("${env:GITHUB_REF}".StartsWith("refs/tags/v")) {
            $tag = "${env:GITHUB_REF}".Substring("refs/tags/v".Length)
            if ($tag -ne $app) { throw "tag v$tag != APP_VERSION $app" }
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          # OpenVINO *runtime* only: this is what gets bundled so the NPU /
          # iGPU / OpenVINO-CPU profiles work in the installed app.
          python -m pip install -r requirements-openvino-runtime.txt

      - name: Convert Whisper to OpenVINO (isolated env)
        # optimum-intel pulls in torch (multi-GB) and is only needed to produce
        # the IR files. It lives in its own venv so PyInstaller never sees it
        # and cannot drag torch into the bundle.
        run: |
          # Export with the *same* OpenVINO version that will be bundled: the
          # runtime refuses IR produced by a newer release, and the two
          # environments resolve their versions independently.
          $ov = python -c "import importlib.metadata as m; print(m.version('openvino'))"
          Write-Host "Exporting with openvino==$ov"
          python -m venv .convert
          .\.convert\Scripts\python.exe -m pip install --upgrade pip
          .\.convert\Scripts\python.exe -m pip install "optimum-intel[openvino]>=1.21" "nncf>=2.14" "openvino==$ov"
          # FP16, not int8: this is the precision the shipping engine (Intel
          # Arc iGPU) was measured on and validated with. The iGPU runs FP16
          # natively, so int8 buys size, not speed, and costs accuracy.
          .\.convert\Scripts\optimum-cli.exe export openvino `
            --model openai/whisper-small --weight-format fp16 `
            models\openvino\whisper-small
          # WhisperPipeline needs the tokenizer/detokenizer IR too, and
          # optimum-cli only *warns* when their conversion fails -- without
          # this check CI would stay green and ship an OpenVINO that dies on
          # the user's first dictation.
          $required = @(
            "openvino_encoder_model.xml",
            "openvino_decoder_model.xml",
            "openvino_tokenizer.xml",
            "openvino_detokenizer.xml"
          )
          foreach ($f in $required) {
            if (-not (Test-Path "models\openvino\whisper-small\$f")) {
              throw "OpenVINO export is incomplete: $f is missing"
            }
          }
          Get-ChildItem models\openvino\whisper-small | Select-Object Name, Length
          # ~3 GB of torch/nncf: reclaim the space before PyInstaller runs.
          Remove-Item -Recurse -Force .convert

      - name: Generate icon assets
        run: python scripts/make_icons.py

      - name: Build portable app (PyInstaller)
        # Fail the build rather than quietly ship an installer whose OpenVINO
        # profiles are dead (see the spec).
        env:
          PLUME_REQUIRE_OPENVINO: "1"
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/Plume.spec

      # Authenticode signing. Both steps are no-ops until the two repository
      # secrets exist, so the build keeps producing an unsigned installer today
      # and starts producing a signed one the day a certificate is added, with
      # no further change. See CONTRIBUTING.md#code-signing.
      #
      # The app exe is signed *before* Inno packages it: SmartScreen judges the
      # exe the user ends up running, not just the setup that delivered it.
      - name: Sign the app executable
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: ./scripts/sign_windows.ps1 -Path "dist\Plume\Plume.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        run: |
          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\inno\Plume.iss"

      # Only on manual runs: with the OpenVINO runtime and the converted model
      # bundled, this folder is ~700 MB, and a tagged build already publishes
      # the installer as a release asset.
      - name: Upload portable app
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Plume-portable
          path: dist/Plume/

      - name: Sign the installer
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: ./scripts/sign_windows.ps1 -Path "dist\installer\Plume-Setup-*.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Plume-installer
          path: dist/installer/*.exe

      # On a version tag (e.g. v0.4.0), publish a GitHub Release with the
      # installer attached so it can be downloaded directly.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
