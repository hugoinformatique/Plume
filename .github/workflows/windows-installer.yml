name: Windows Installer

# Builds the portable app (PyInstaller) and the Inno Setup installer on Windows.
# Referenced by INSTALLER_WINDOWS.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write  # allow the release step to publish the installer

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Generate icon assets
        run: python scripts/make_icons.py

      - name: Build portable app (PyInstaller)
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/Plume.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        run: |
          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\inno\Plume.iss"

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Plume-portable
          path: dist/Plume/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Plume-installer
          path: dist/installer/*.exe

      # On a version tag (e.g. v0.3.0), publish a GitHub Release with the
      # installer attached so it can be downloaded directly.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
